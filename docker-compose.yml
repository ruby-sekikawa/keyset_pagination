services:
  db:
    image: postgres:16
    container_name: keyset_lab_pg
    environment:
      POSTGRES_USER: keyset
      POSTGRES_PASSWORD: keyset
      POSTGRES_DB: keyset_lab_development
      # Rails のマイグレーション/接続を素直にするため localtime ではなく UTC 固定
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"          # ホストの 5432 と衝突しないよう 5433 に割り当て
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 計画書 1.2 の設定を command で明示的に注入する。
    # postgresql.conf をマウントせず -c で渡すことで「どの設定を変えたか」が一目で分かる。
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"          # デフォルト128MBだとキャッシュ挙動が観察しづらい
      - "-c"
      - "work_mem=16MB"               # 小さいとSortが即ディスクに落ちる
      - "-c"
      - "track_io_timing=on"          # EXPLAIN に I/O time が出る
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_wal_size=4GB"            # 1000万行INSERT時のチェックポイント頻発を緩和
    shm_size: "1gb"                    # shared_buffers=1GB を活かすため /dev/shm を拡張
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyset -d keyset_lab_development"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
